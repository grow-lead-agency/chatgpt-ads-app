# GrowLead fork tooling (GRO-1302, Python Standard v1, adopce vlna 1).
# gitleaks nad celou historií + pip-audit nad lockem (bez dev) + zizmor nad workflows.
# Semgrep přijde ve vlně 2 (nejdřív triáž nálezů v upstream kódu).
# Runner natvrdo GitHub-hosted, důvod v ci.yml (PUBLIC repo vs self-hosted CI_RUNNER).
name: Security

on:
  pull_request:
  push:
    branches: [growlead-safety]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (sha256 pinned in workflow)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 linux_x64 tarballu, ověřeno 2026-09-15 proti release checksums.txt i stažením.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --redact --verbose

  pip-audit:
    name: pip-audit (runtime deps z uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: "0.12.13"

      - name: Sync
        run: uv sync --locked

      - name: Audit lockfile export (--no-dev)
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          uv export --format requirements-txt --no-dev --no-emit-project --locked > "$tmp"
          uv run pip-audit -r "$tmp" --require-hashes --progress-spinner off
          rm -f "$tmp"

  zizmor:
    name: zizmor (GitHub Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: "0.12.13"

      - name: Scan workflows
        run: uvx zizmor==1.30.1 --min-severity medium .github/workflows
